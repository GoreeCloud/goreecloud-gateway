name: Gateway Isolated Runtime Acceptance

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-runtime:
    runs-on: ubuntu-latest
    env:
      GOREECLOUD_GATEWAY_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.GOREECLOUD_GATEWAY_SOURCE_REVISION }}
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$GOREECLOUD_GATEWAY_SOURCE_REVISION"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build exact Gateway artifacts
        run: |
          set -euo pipefail
          go build -trimpath -o /tmp/goreecloud-gateway ./cmd/gateway
          go build -trimpath -o /tmp/goreecloud-gateway-recovery ./cmd/gateway-recovery
      - name: Run isolated runtime acceptance
        run: |
          python3 scripts/isolated_runtime_acceptance.py \
            --binary /tmp/goreecloud-gateway \
            --recovery-binary /tmp/goreecloud-gateway-recovery \
            --evidence /tmp/goreecloud-gateway-evidence.json
          python3 -m json.tool /tmp/goreecloud-gateway-evidence.json >/dev/null
      - name: Upload sanitized runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: gateway-isolated-runtime-${{ env.GOREECLOUD_GATEWAY_SOURCE_REVISION }}
          path: /tmp/goreecloud-gateway-evidence.json
          if-no-files-found: error
          retention-days: 30
